name: Update-Log an Discord
on:
  push:
    branches: [main]
    paths: [manifest.json]
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nachricht senden
        env:
          HOOK: ${{ secrets.UPDATE_WEBHOOK }}
        run: node .github/scripts/announce.js
